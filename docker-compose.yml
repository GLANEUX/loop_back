services:
  api:
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile.dev}
    container_name: loop_api
    restart: unless-stopped
    env_file:
      - .env.${NODE_ENV:-development}
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - loop_network

  db:
    image: postgres:16-alpine
    container_name: loop_db
    environment:
      POSTGRES_USER: loop_user
      POSTGRES_PASSWORD: loop_pass
      POSTGRES_DB: loop_${NODE_ENV:-dev}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - loop_network

networks:
  loop_network:
    driver: bridge

volumes:
  pg_data:
