services:
  db:
    image: postgres:16-alpine
    container_name: loop_db_test
    environment:
      POSTGRES_USER: loop_test_user
      POSTGRES_PASSWORD: loop_test_pass
      POSTGRES_DB: loop_test
    ports:
      - "5433:5432"
    volumes:
      - pg_data_test:/var/lib/postgresql/data
    networks:
      - loop_test_network

networks:
  loop_test_network:
    driver: bridge

volumes:
  pg_data_test:
