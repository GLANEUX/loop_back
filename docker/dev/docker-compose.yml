services:
  api:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: loop_api_dev
    restart: unless-stopped
    env_file:
      - ../../.env.development
    ports:
      - "3001:3001"
    depends_on:
      - db
    volumes:
      - ../..:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/dist
    networks:
      - loop_dev_network

  db:
    image: postgres:16-alpine
    container_name: loop_db_dev
    environment:
      POSTGRES_USER: loop_user
      POSTGRES_PASSWORD: loop_pass
      POSTGRES_DB: loop_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    networks:
      - loop_dev_network

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: loop_pgadmin_dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: o.glaneux@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data_dev:/var/lib/pgadmin
    networks:
      - loop_dev_network

networks:
  loop_dev_network:
    driver: bridge

volumes:
  pg_data_dev:
  pgadmin_data_dev:
