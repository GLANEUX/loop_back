name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      LOG_LEVEL: info
      PORT: 3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Run tests e2e
        run: npm run test:e2e

      - name: Build project
        run: npm run build

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/loop_back
            git pull origin main

            cd docker/prod
            docker compose down
            docker compose up -d --build

            # attendre un peu que le container soit stable
            sleep 3

            # migrations avec retry (si tu ne les mets pas au CMD)
            for i in {1..10}; do
              if docker compose exec -T api npx typeorm migration:run -d dist/db/data-source.js; then
                echo "✅ Migrations OK"
                break
              fi
              echo "⏳ migrations retry ($i/10)"
              sleep 3
            done

            # health local (plus fiable que le domaine)
            for i in {1..30}; do
              if curl -fsS http://localhost:8080/health >/dev/null; then
                echo "✅ Health check OK"
                exit 0
              fi
              echo "⏳ waiting health ($i/30)"
              sleep 2
            done

            echo "❌ Health check failed"
            docker compose logs --tail=200 api
            exit 1
