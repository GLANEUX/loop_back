name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loop_test_user
          POSTGRES_PASSWORD: loop_test_pass
          POSTGRES_DB: loop_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U loop_test_user -d loop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://loop_test_user:loop_test_pass@127.0.0.1:5433/loop_test
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      LOG_LEVEL: info
      PORT: 3001

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            (echo > /dev/tcp/127.0.0.1/5433) >/dev/null 2>&1 && exit 0
            echo "Waiting for Postgres on 127.0.0.1:5433 ($i/30)..."
            sleep 2
          done
          echo "Postgres did not become ready in time."
          exit 1

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Run tests e2e
        run: npm run test:e2e

      - name: Build project
        run: npm run build

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
              set -e

              cd /home/loop_back
              git pull origin main

              cd docker/prod
              docker compose down
              docker compose up -d --build

              # attendre un peu
              sleep 3

              # migrations (retry)
              for i in {1..10}; do
                if docker compose exec -T api npm run migration:run:prod; then
                  echo "✅ Migrations OK"
                  break
                fi
                echo "⏳ migrations retry ($i/10)"
                sleep 3
              done

              for i in {1..10}; do
                if curl -fsS http://localhost:3001/health >/dev/null; then
                  echo "✅ Health check OK"
                  exit 0
                fi
                echo "⏳ waiting health ($i/30)"
                sleep 2
              done


              echo "❌ Health check failed"
              docker compose logs --tail=200 api
              exit 1
